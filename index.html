<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Support QA Score Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .container {
      max-width: 760px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 30px;
    }

    .category {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input[type="number"],
    input[type="text"],
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      resize: vertical;
      min-height: 96px;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 2px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .actions button {
      margin-top: 0;
    }

    .secondary {
      background: #374151;
    }

    .secondary:hover {
      background: #1f2937;
    }

    .validation-error {
      color: #b91c1c;
      margin: 12px 0 0;
      min-height: 20px;
    }

    .result {
      display: none;
      margin-top: 30px;
      padding: 22px;
      border-radius: 10px;
      background: #f3f4f6;
    }

    .score {
      font-size: 34px;
      font-weight: bold;
      text-align: center;
      margin: 10px 0;
    }

    .rating {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      text-align: center;
      margin-top: 12px;
    }

    .error {
      color: #b91c1c;
      font-weight: bold;
    }

    .success {
      color: #15803d;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      margin-top: 25px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 16px auto;
        padding: 12px;
      }

      .card {
        padding: 20px;
        border-radius: 8px;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      body {
        background: white;
      }

      .container {
        margin: 0;
        max-width: none;
      }

      .card {
        box-shadow: none;
      }

      .actions,
      #calculateBtn,
      .footer {
        display: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>Support QA Score Calculator</h1>

      <p class="subtitle">
        Evaluate a customer support interaction using a 100-point QA framework.
      </p>
      <div class="category">
    <label for="agentName">Agent Name</label>
    <input
        type="text"
        id="agentName"
        placeholder="Enter agent name"
    >
      </div>

      <div class="category">
    <label for="interactionId">Interaction ID</label>
    <input
        type="text"
        id="interactionId"
        placeholder="Enter interaction ID"
    >
      </div>

      <div class="category">
    <label for="qaAnalyst">QA Analyst</label>
    <input
        type="text"
        id="qaAnalyst"
        placeholder="Enter QA analyst name"
    >
      </div>
      <div class="category">
        <label for="communication">
          Communication & Professionalism (Max 20)
        </label>

        <input
          type="number"
          id="communication"
          min="0"
          max="20"
          placeholder="Enter score from 0 to 20"
        >
      </div>

      <div class="category">
        <label for="understanding">
          Understanding the Customer's Issue (Max 20)
        </label>

        <input
          type="number"
          id="understanding"
          min="0"
          max="20"
          placeholder="Enter score from 0 to 20"
        >
      </div>

      <div class="category">
        <label for="resolution">
          Resolution & Accuracy (Max 30)
        </label>

        <input
          type="number"
          id="resolution"
          min="0"
          max="30"
          placeholder="Enter score from 0 to 30"
        >
      </div>

      <div class="category">
        <label for="compliance">
          Process Compliance (Max 15)
        </label>

        <input
          type="number"
          id="compliance"
          min="0"
          max="15"
          placeholder="Enter score from 0 to 15"
        >
      </div>

      <div class="category">
        <label for="experience">
          Customer Experience (Max 15)
        </label>

        <input
          type="number"
          id="experience"
          min="0"
          max="15"
          placeholder="Enter score from 0 to 15"
        >
      </div>

      <div class="category">
        <label for="critical">
          Critical Error Identified?
        </label>

        <select id="critical">
          <option value="no">No</option>
          <option value="yes">Yes</option>
        </select>
      </div>
      <div class="category">
    <label for="qaFeedback">QA Feedback</label>
    <textarea
        id="qaFeedback"
        rows="4"
        placeholder="Enter QA feedback, strengths, and improvement opportunities"
    ></textarea>
      </div>

      <div class="category">
    <label for="coachingNotes">Coaching Notes</label>
    <textarea
        id="coachingNotes"
        rows="4"
        placeholder="Enter coaching notes and action items"
    ></textarea>
      </div>

      <button id="calculateBtn" type="button">
        Calculate QA Score
      </button>

      <p class="validation-error" id="validationError" role="alert"></p>

      <div class="result" id="result" aria-live="polite">

        <div class="score" id="score"></div>

        <div class="rating" id="rating"></div>

        <div class="status" id="status"></div>

      </div>

      <div class="actions" id="reportActions" hidden>
        <button class="secondary" id="downloadJsonBtn" type="button">Download JSON</button>
        <button class="secondary" id="downloadCsvBtn" type="button">Download CSV</button>
        <button class="secondary" id="printReportBtn" type="button">Print Report</button>
      </div>

      <div class="footer">
        Support QA Scorecard • Open-source QA framework
      </div>

    </div>

  </div>

  <script src="web/app.js"></script>

</body>
</html>
